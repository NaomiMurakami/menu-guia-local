<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Locais - Mogi das Cruzes</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
            <h1>Contato</h1>
        
        <nav>
            <ul>
                <li><a href="index.html" >Início</a></li>
                <li><a href="locais.html">Locais</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="contato.html" class="ativo">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Entre em Contato em caso de dúvidas, críticas ou sugestões para melhoramentos</h2>
        <form action="#" method="post">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="motivo">Motivo do Contato:</label>
                <select id="motivo" name="motivo">
                    <option value="duvida">Dúvidas</option>
                    <option value="critica">Críticas</option>
                    <option value="sugestao">Sugestões</option>
                </select>
            </div>

            <div class="form-group">
                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" required placeholder="Assunto da mensagem">
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>

            <button type="submit">Enviar Mensagem</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
